<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモンスリープ 料理サーチ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>ポケモンスリープ 料理サーチ</h1>
    <p class="sub">カレー・デザート・サラダから各1品を選び、条件を満たす組み合わせを検索します</p>
  </header>

  <main>
    <section class="panel" aria-label="検索条件">
      <div class="controls">
        <div class="field">
          <label for="max-types">食材種類数 (上限)</label>
          <input type="number" id="max-types" min="1" max="20" value="5">
        </div>
        <div class="field">
          <label for="min-ratio">最低 ratio (各料理)</label>
          <input type="number" id="min-ratio" min="0" step="0.01" value="1.3">
        </div>
      </div>
      <div class="field ng-field">
        <label>NG食材 (含む料理を除外)</label>
        <div class="ng-list" id="ng-list"></div>
        <button type="button" id="ng-clear" class="link-btn">NG全解除</button>
      </div>
      <div class="actions">
        <button type="button" id="search" class="primary-btn">検索</button>
      </div>
    </section>

    <section class="panel results-panel">
      <h2>検索結果 <span id="result-count" class="count">-</span></h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
