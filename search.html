<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモンスリープ 料理サーチ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html">トップ</a>
  </nav>
  <header>
    <h1>ポケモンスリープ 料理サーチ</h1>
    <p class="sub">カレー・デザート・サラダから各1品を選び、条件を満たす組み合わせを検索します</p>
  </header>

  <main>
    <section class="panel" aria-label="検索条件">
      <div class="controls">
        <div class="field">
          <label for="max-types">食材種類数 (上限)</label>
          <input type="number" id="max-types" min="1" max="20" value="8">
        </div>
        <div class="field">
          <label for="max-pot">最大鍋容量 (各料理)</label>
          <input type="number" id="max-pot" min="1" max="200" value="81">
        </div>
        <div class="field">
          <label for="min-ratio">最低 ratio (各料理)</label>
          <input type="number" id="min-ratio" min="0" step="0.01" value="1.25" disabled>
        </div>
        <div class="field">
          <label for="min-energy">最低エナジー (各料理)</label>
          <input type="number" id="min-energy" min="0" step="100" value="9000">
        </div>
        <div class="field">
          <label class="toggle">
            <input type="checkbox" id="filter-energy" checked>
            最低エナジーで絞り込む
          </label>
        </div>
      </div>
      <div class="fields">
        <div class="field ng-field">
          <label>NG食材 (含む料理を除外)</label>
          <div class="ng-list" id="ng-list"></div>
          <button type="button" id="ng-clear" class="link-btn">NG全解除</button>
        </div>
        <div class="field hl-field">
          <label>ハイライト食材 (結果で強調)</label>
          <div class="ng-list" id="hl-list"></div>
          <button type="button" id="hl-clear" class="link-btn">ハイライト全解除</button>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="search" class="primary-btn" disabled>検索</button>
      </div>
    </section>

    <section class="panel results-panel">
      <h2>検索結果 <span id="result-count" class="count">-</span></h2>
      <div id="results"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
