<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケモンスリープ レシピ食材チェッカー</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="index.html">トップ</a>
  </nav>
  <header>
    <h1>レシピ食材チェッカー</h1>
    <p class="sub">所持している食材(個数)を指定し、どのレシピが作れるかを確認します</p>
  </header>

  <main>
    <section class="panel" aria-label="入力">
      <div class="mode-switch">
        <label>
          <input type="radio" name="mode" id="mode-check" value="check" checked>
          食材のみ指定
        </label>
        <label>
          <input type="radio" name="mode" id="mode-count" value="count">
          食材と個数を入力
        </label>
      </div>

      <div class="pane" id="check-pane">
        <div class="pane-label">所持している食材をチェック (複数選択可)</div>
        <div class="ing-checks" id="ing-checks"></div>
        <button type="button" id="clear-check" class="link-btn">チェックをリセット</button>
      </div>

      <div class="pane" id="count-pane" hidden>
        <div class="pane-label">食材ごとの所持数を入力 (0 = 所持なし)</div>
        <button type="button" id="ocr-btn" class="ocr-btn">📷 スクショから自動入力</button>
        <p class="ocr-help">食材バッグのスクショ（19食材が全て見える状態）を読み取り、個数を一括入力します。画像は外部に送信されません。</p>
        <div class="ing-counts" id="ing-counts"></div>
        <button type="button" id="clear-count" class="link-btn">入力をリセット</button>
      </div>
    </section>

    <section class="panel">
      <h2>レシピ一覧</h2>
      <div class="cat-filters" id="cat-filters"></div>
      <div id="recipes"></div>
    </section>
  </main>

  <div id="ocr-modal" class="ocr-modal" hidden aria-hidden="true">
    <div class="ocr-modal-backdrop" id="ocr-backdrop"></div>
    <div class="ocr-modal-panel" role="dialog" aria-modal="true" aria-labelledby="ocr-modal-title">
      <div class="ocr-modal-head">
        <h2 id="ocr-modal-title">スクショから自動入力</h2>
        <button type="button" id="ocr-close" class="ocr-close" aria-label="閉じる">×</button>
      </div>
      <div class="ocr-modal-body">
        <label class="ocr-drop" id="ocr-drop">
          <div class="ocr-drop-icon">📸</div>
          <div class="ocr-drop-title">タップ/クリック または ドラッグ＆ドロップ</div>
          <div class="ocr-drop-hint">PNG / JPG 1枚 / 貼り付け (Ctrl+V) もOK</div>
          <input type="file" id="ocr-file" accept="image/*" hidden>
        </label>
        <div class="ocr-preview" id="ocr-preview" hidden>
          <img id="ocr-thumb" alt="選択した画像のプレビュー">
          <span id="ocr-filename"></span>
        </div>
        <div class="ocr-progress" id="ocr-progress" hidden>
          <div class="ocr-progress-bar"><div id="ocr-bar"></div></div>
          <div class="ocr-status" id="ocr-status">待機中</div>
        </div>
        <p class="ocr-warn" id="ocr-warn" hidden></p>
      </div>
      <div class="ocr-modal-foot">
        <button type="button" id="ocr-run" class="primary-btn" disabled>OCR実行</button>
        <button type="button" id="ocr-cancel" class="cat-filter">キャンセル</button>
      </div>
      <p class="ocr-note">完全ブラウザ内処理。画像はサーバーに送信されません。初回は辞書（約15MB）のダウンロードで数秒かかります。</p>
    </div>
  </div>

  <script src="js/ocr-ingredient.js"></script>
  <script src="js/recipes.js"></script>
</body>
</html>
